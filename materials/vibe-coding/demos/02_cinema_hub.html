    color: #E50914;
  }
  .logo span { color: #fff; font-weight: 400; }
  .nav-links { display: flex; gap: 28px; font-size: 14px; font-weight: 500; }
  .nav-links a { opacity: 0.8; transition: opacity 0.2s; cursor: pointer; }
  .nav-links a:hover, .nav-links a.active { opacity: 1; }
  .nav-links a.active { color: #E50914; }
  .nav-actions { display: flex; gap: 18px; align-items: center; }
  .search-box {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px 8px 36px; border-radius: 999px;
    color: #fff; font-size: 13px; width: 220px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ccc' stroke-width='2'><circle cx='11' cy='11' r='8'/><path d='M21 21l-4.35-4.35'/></svg>");
    background-repeat: no-repeat; background-position: 10px center; background-size: 16px;
  }
  .search-box::placeholder { color: rgba(255,255,255,0.5); }
  .avatar {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #E50914, #831010);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative; height: 85vh; min-height: 560px;
    overflow: hidden;
  }
  .hero-slide {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity 1s;
    display: flex; align-items: flex-end;
    padding: 0 50px 80px 50px;
  }
  .hero-slide { pointer-events:none; }
  .hero-slide.active { opacity: 1; pointer-events:auto; }
  .hero-slide::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(10,10,15,0.7) 65%, #0a0a0f 100%),

    position: absolute; inset: 0; z-index: 0;
  }
  .hero-content { position: relative; z-index: 2; max-width: 600px; }
  .hero-cat {
    display: inline-block; padding: 4px 12px; background: rgba(229, 9, 20, 0.9);

    border-radius: 4px; margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 68px; font-weight: 900; line-height: 0.95; letter-spacing: -2px;

  .modal {

    animation: slideUp 0.4s;

  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

html[data-vc-paused] *, html[data-vc-paused] *::before, html[data-vc-paused] *::after {
  animation-play-state: paused !important;
  transition: none !important;
  scroll-behavior: auto !important;

<script id="vc-embed-control">
// The sandboxed parent can pause motion. No page content is sent across this boundary.
window.vcEmbed = (() => {
  let parentPaused = false;
  let speed = 1;
  const subscribers = new Set();
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  const isPaused = () => parentPaused || document.hidden || reduced.matches;
  function publish() {
    document.documentElement.toggleAttribute('data-vc-paused', isPaused());
    subscribers.forEach(callback => callback(isPaused()));
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !event.data || typeof event.data !== 'object') return;
    if (event.data.type === 'vc:pause' && typeof event.data.paused === 'boolean') {
      parentPaused = event.data.paused;
      publish();
    } else if (event.data.type === 'vc:speed' && (event.data.speed === 1 || event.data.speed === 2)) {
      speed = event.data.speed;
    }
  });
  document.addEventListener('visibilitychange', publish);
  reduced.addEventListener('change', publish);
  window.addEventListener('load', () => {
    publish();
    window.parent.postMessage({ type: 'vc:ready' }, '*');
  }, { once: true });
  publish();
  return Object.freeze({
    get paused() { return isPaused(); },
    get speed() { return speed; },
    onChange(callback) { subscribers.add(callback); return () => subscribers.delete(callback); }
  });
})();
</script>

  d.type = 'button';
  d.setAttribute('aria-label', 'Показать фильм «' + movies[i].title + '»');
  d.setAttribute('aria-pressed', String(i === 0));
  d.className = 'dot' + (i === 0 ? ' active' : '');

  dotsEl.appendChild(d);
});
hero.appendChild(dotsEl);

let slideIdx = 0;
function goToSlide(i) {
  slideIdx = i;
  document.querySelectorAll('.hero-slide').forEach((s, k) => s.classList.toggle('active', k === i));
  document.querySelectorAll('.hero-dots .dot').forEach((d, k) => {
    d.classList.toggle('active', k === i);
    d.setAttribute('aria-pressed', String(k === i));
  });
}
let carouselTimer = null;
function updateCarousel(paused) {
  if (carouselTimer !== null) clearInterval(carouselTimer);
  carouselTimer = paused ? null : setInterval(() => goToSlide((slideIdx + 1) % movies.length), 7000);
}
window.vcEmbed.onChange(updateCarousel);
updateCarousel(window.vcEmbed.paused);

// ============ RENDER ROWS ============
function createCard(m, idx, showRank = false) {
  const c = document.createElement('div');
  c.className = 'card';
  c.tabIndex = 0;
  c.setAttribute('role', 'button');
  c.setAttribute('aria-label', m.title + ' — открыть карточку');
  c.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openModalByTitle(m.title);
    }
  });
  if (showRank) {
    c.innerHTML = `
      <span class="card-rank">${idx + 1}</span>
      <div class="card-img" style="background-image: ${m.grad}; margin-left: 30px; width: calc(100% - 30px);"></div>
      <div class="card-info">
        <h3 style="margin-left: 30px;">${m.title}</h3>
        <div class="meta" style="margin-left: 30px;">
          <span class="stars">★ ${m.rating}</span> · <span>${m.year}</span>
        </div>
      </div>
    `;
  } else {
    c.innerHTML = `
      <div class="card-img" style="background-image: ${m.grad};"></div>
      <div class="card-info">
        <h3>${m.title}</h3>
        <div class="meta">
          <span class="stars">★ ${m.rating}</span>
          <span>·</span>
          <span>${m.year}</span>
          <span>·</span>
          <span>${m.genres[0]}</span>
        </div>
      </div>
    `;
  }
  c.onclick = () => openModalByTitle(m.title);
  return c;
}

function addRow(title, items, showRank = false) {
  const container = document.getElementById('rows');
  const section = document.createElement('section');
  section.className = 'row-section';
  section.innerHTML = `<div class="row-title">${title}<span class="explore">Все →</span></div>`;
  const row = document.createElement('div');
  row.className = 'scroll-row' + (showRank ? ' card-top10' : '');
  items.forEach((m, i) => row.appendChild(createCard(m, i, showRank)));
  section.appendChild(row);
  container.appendChild(section);
}

const catalogMovies = [...new Map([...movies, ...trendingMovies, ...newMovies, ...recommendedMovies].map(movie => [movie.title, movie])).values()];
let catalogSection = 'home';
const searchInput = document.getElementById('movie-search');
const genreFilter = document.getElementById('genre-filter');
function filterCatalog(items, query, genre) {
  const normalized = query.trim().toLocaleLowerCase('ru').replace(/ё/g, 'е');
  return items.filter(movie => {
    const haystack = [movie.title, movie.year, ...movie.genres].join(' ').toLocaleLowerCase('ru').replace(/ё/g, 'е');
    return (!genre || movie.genres.includes(genre)) && (!normalized || haystack.includes(normalized));
  });
}
function renderCatalog() {
  const query = searchInput.value;
  const genre = genreFilter.value;
  const home = catalogSection === 'home' && !query.trim() && !genre;
  hero.hidden = !home;
  document.getElementById('rows').innerHTML = '';
  const status = document.getElementById('catalog-status');
  if (home) {
    status.textContent = '';
    addRow('🔥 Топ-10 на этой неделе', trendingMovies.slice(0, 10), true);
    addRow('🆕 Новинки', newMovies);
    addRow('🎯 Рекомендуем именно вам', recommendedMovies);
    addRow('💥 Фантастика и триллеры', [...trendingMovies, ...newMovies].filter(movie => movie.genres.some(genre => ['Фантастика', 'Триллер'].includes(genre))));
    addRow('🎬 Премьеры месяца', movies.concat(trendingMovies.slice(0, 5)));
  } else {
    const source = catalogSection === 'new' ? newMovies : catalogMovies;
    const matches = filterCatalog(source, query, genre);
    status.textContent = 'Найдено: ' + matches.length + ' из ' + source.length;
    if (matches.length) addRow(catalogSection === 'new' ? 'Новинки' : 'Фильмы', matches);
    else {
      const empty = document.createElement('p');
      empty.className = 'catalog-empty';
      empty.textContent = 'Таких фильмов нет в демо-каталоге. Измените запрос или выберите другой жанр.';
      document.getElementById('rows').appendChild(empty);
    }
  }
}
[...new Set(catalogMovies.flatMap(movie => movie.genres))].sort((a, b) => a.localeCompare(b, 'ru')).forEach(genre => {
  const option = document.createElement('option');
  option.value = genre;
  option.textContent = genre;
  genreFilter.appendChild(option);
});
searchInput.addEventListener('input', renderCatalog);
genreFilter.addEventListener('change', renderCatalog);
document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
  catalogSection = button.dataset.filter;
  if (catalogSection === 'home') { searchInput.value = ''; genreFilter.value = ''; }
  document.querySelectorAll('[data-filter]').forEach(item => {
    item.classList.toggle('active', item === button);
    item.setAttribute('aria-pressed', String(item === button));
  });
  renderCatalog();
}));
renderCatalog();

// ============ MODAL ============
const modal = document.getElementById('modal');
const modalInner = document.getElementById('modal-inner');
let modalReturnFocus = null;
function showModal() {
  modalReturnFocus = document.activeElement;
  modal.classList.add('show');
  const closeButton = modalInner.querySelector('.modal-close');
  if (closeButton) { closeButton.setAttribute('aria-label', 'Закрыть карточку'); closeButton.focus(); }
}

function openModal(id) {
  const m = movies.find(x => x.id === id);
  if (!m) return;
  modalInner.innerHTML = `
    <div class="modal-hero">
      <div class="modal-hero-bg gradient-bg" style="background: ${m.grad}"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-play"></div>
    </div>
    <div class="modal-body">
      <h2>${m.title}</h2>
      <div class="modal-meta">
        <span class="match">${m.match}% совпадение</span>
        <span>${m.year}</span>
        <span class="age">${m.age}</span>
        <span>${m.duration}</span>
        <span style="color:#fbbf24;">★ ${m.rating}</span>
      </div>
      <p class="modal-description">${m.desc}</p>
      <div class="modal-tags">
        ${m.genres.map(g => `<span class="tag">${g}</span>`).join('')}
      </div>
      <div class="modal-row">
        <dt>Режиссёр:</dt><dd>${m.director}</dd>
        <dt>В главных ролях:</dt><dd>${m.cast}</dd>
        <dt>Жанры:</dt><dd>${m.genres.join(', ')}</dd>
        <dt>Язык:</dt><dd>Русский · Оригинал (Eng)</dd>
      </div>
    </div>
  `;
  showModal();
}
function openModalByTitle(title) {
  const m = movies.find(x => x.title === title);
  if (m) openModal(m.id);
  else {
    // Генерируем fake detailed модалку
    const fake = trendingMovies.concat(newMovies, recommendedMovies).find(x => x.title === title);
    if (fake) {
      modalInner.innerHTML = `
        <div class="modal-hero">
          <div class="modal-hero-bg gradient-bg" style="background: ${fake.grad}"></div>
          <button class="modal-close" onclick="closeModal()">×</button>
          <div class="modal-play"></div>
        </div>
        <div class="modal-body">
          <h2>${fake.title}</h2>
          <div class="modal-meta">
            <span class="match">${80 + Math.floor(Math.random()*18)}% совпадение</span>
            <span>${fake.year}</span>
            <span class="age">16+</span>
            <span>1ч ${30 + Math.floor(Math.random()*40)}мин</span>
            <span style="color:#fbbf24;">★ ${fake.rating}</span>
          </div>
          <p class="modal-description">Это демонстрационная карточка. Название и данные фильма вымышлены.</p>
          <div class="modal-tags">
            ${fake.genres.map(g => `<span class="tag">${g}</span>`).join('')}
          </div>
        </div>
      `;
      showModal();
    }
  }
}
function closeModal() {
  modal.classList.remove('show');
  if (modalReturnFocus && modalReturnFocus.isConnected) modalReturnFocus.focus();
  modalReturnFocus = null;
}
modal.onclick = e => { if (e.target === modal) closeModal(); };
window.addEventListener('keydown', event => {
  if (!modal.classList.contains('show')) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    event.stopImmediatePropagation();
    closeModal();
  } else if (event.key === 'Tab') {
    event.preventDefault();
    modalInner.querySelector('.modal-close').focus();
  }
});

// ============ NAV SCROLL ============
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('solid', window.scrollY > 80);
});

// Horizontal scroll via wheel
document.querySelectorAll('.scroll-row').forEach(row => {
  row.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      row.scrollLeft += e.deltaY;
    }
  });
});
